esphome:
  name: seeed-terminal
  friendly_name: seeed-terminal

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

http_request:
  verify_ssl: False
  timeout: 15s
  watchdog_timeout: 20s


# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret seeed_terminal

ota:
  - platform: esphome
    password: !secret seeed_terminal_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: ".lan"

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Seeed-Terminal Fallback Hotspot"
    password: !secret seeed_terminal_ap

captive_portal:

online_image:
  - id: dashboard_image
    format: PNG
    type: BINARY
    buffer_size: 30000
    url: !secret seeed_terminal_image_url
    update_interval: 30s
    on_download_finished:
      - delay: 0ms
      - component.update: main_display

# define SPI interface
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: waveshare_epaper
    id: main_display
    model: 7.50inv2p
    cs_pin: GPIO44
    dc_pin: GPIO10
    reset_pin: GPIO38
    busy_pin: 
      number: GPIO4
      inverted: true
    update_interval: 30s
    full_update_every: 30
    lambda: |-
      it.image(0, 0, id(dashboard_image));
